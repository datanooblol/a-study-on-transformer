[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a-study-on-transformer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.4",
    "mlflow==3.14.0",
    "torch>=2.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sequences_to_multiple_outcomes"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "nbformat>=5.10.4",
]
